<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Connexion à votre espace PropulsIA — Accédez à vos outils de production et votre historique.">
  <title>Connexion — PropulsIA</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
</head>

<body>
  <div class="auth-page">
    <div
      style="position:absolute; top:-20%; left:-10%; width:500px; height:500px; background:radial-gradient(circle, rgba(170,255,0,0.07) 0%, transparent 70%); border-radius:50%; animation: float 8s ease-in-out infinite;">
    </div>
    <div
      style="position:absolute; bottom:-20%; right:-10%; width:400px; height:400px; background:radial-gradient(circle, rgba(120,200,0,0.05) 0%, transparent 70%); border-radius:50%; animation: float 10s ease-in-out infinite reverse;">
    </div>

    <div class="auth-card glass-card">
      <div style="text-align:center; margin-bottom:32px;">
        <a href="index.html" class="logo" style="justify-content:center; margin-bottom:12px;">
          <div class="logo-icon">⚡</div>
          <span>PropulsIA</span>
        </a>
        <p style="color:var(--text-muted); font-size:0.9rem;">Accédez à votre espace de production</p>
      </div>

      <div class="auth-tabs" id="authTabs">
        <div class="auth-tab active" onclick="switchAuthTab('login')">Connexion</div>
        <div class="auth-tab" onclick="switchAuthTab('register')">Inscription</div>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="votre@email.pf" required>
        </div>
        <div class="form-group">
          <label for="loginPassword">Mot de passe</label>
          <input type="password" id="loginPassword" placeholder="Votre mot de passe" required>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
          <label
            style="display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--text-muted); cursor:pointer;">
            <input type="checkbox" id="rememberMe" style="cursor:pointer; accent-color:var(--primary);"> Se souvenir de moi
          </label>
          <a href="forgot-password.html" style="font-size:0.85rem; color:var(--primary);">Mot de passe oublié ?</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Se connecter →</button>
        <p style="text-align:center; margin-top:16px; font-size:0.85rem; color:var(--text-muted);">
          Pas encore de compte ? <a href="#" onclick="switchAuthTab('register'); return false;"
            style="color:var(--primary);">Créer un compte</a>
        </p>
      </form>

      <form id="registerForm" style="display:none;" onsubmit="handleRegister(event)">
        <div class="form-row">
          <div class="form-group">
            <label for="regFirstName">Prénom</label>
            <input type="text" id="regFirstName" placeholder="Votre prénom" required>
          </div>
          <div class="form-group">
            <label for="regLastName">Nom</label>
            <input type="text" id="regLastName" placeholder="Votre nom" required>
          </div>
        </div>
        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="votre@email.pf" required>
        </div>
        <div class="form-group">
          <label for="regCompany">Entreprise (optionnel)</label>
          <input type="text" id="regCompany" placeholder="Nom de votre commerce">
        </div>
        <div class="form-group">
          <label for="regPassword">Mot de passe</label>
          <input type="password" id="regPassword" placeholder="Minimum 8 caractères" required minlength="8">
        </div>
        <div class="form-group">
          <label for="regPasswordConfirm">Confirmer le mot de passe</label>
          <input type="password" id="regPasswordConfirm" placeholder="Confirmez" required>
        </div>
        <label
          style="display:flex; align-items:flex-start; gap:8px; font-size:0.82rem; color:var(--text-muted); cursor:pointer; margin-bottom:20px;">
          <input type="checkbox" required style="cursor:pointer; margin-top:2px; accent-color:var(--primary);">
          J'accepte les <a href="#" style="color:var(--primary);">conditions d'utilisation</a> et la <a href="#"
            style="color:var(--primary);">politique de confidentialité</a>.
        </label>
        <button type="submit" class="btn btn-primary" style="width:100%;">Créer mon compte →</button>
        <p style="text-align:center; margin-top:16px; font-size:0.85rem; color:var(--text-muted);">
          Déjà un compte ? <a href="#" onclick="switchAuthTab('login'); return false;" style="color:var(--primary);">Se
            connecter</a>
        </p>
      </form>

      <div style="display:flex; align-items:center; gap:16px; margin:24px 0;">
        <div style="flex:1; height:1px; background:var(--border-color);"></div>
        <span style="font-size:0.8rem; color:var(--text-muted);">ou</span>
        <div style="flex:1; height:1px; background:var(--border-color);"></div>
      </div>

      <button
        style="width:100%; padding:12px; border:1px solid var(--border-color); border-radius:var(--radius-full); display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; color:var(--text-secondary); font-size:0.9rem; transition:all 0.3s;"
        onmouseover="this.style.borderColor='var(--primary)'; this.style.background='rgba(170,255,0,0.05)'"
        onmouseout="this.style.borderColor='var(--border-color)'; this.style.background='transparent'">
        📘 Continuer avec Facebook
      </button>

      <div style="text-align:center; margin-top:24px;">
        <a href="index.html" style="font-size:0.85rem; color:var(--text-muted);">← Retour à l'accueil</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">
    <span id="toastIcon">✅</span>
    <span id="toastMessage"></span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(initLoginPage, 200);
    });
  </script>
</body>

</html>
